<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockfish 19 · Analysis</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://images.chesscomfiles.com" crossorigin />
</head>
<body>
  <div class="app">
    <header class="tray tray-top">
      <div class="piece-tray" id="tray-top"></div>
    </header>

    <div class="workspace">
      <div class="board-wrap">
        <div class="eval-rail">
          <div class="eval-bar" id="eval-bar">
            <div class="eval-fill" id="eval-fill"></div>
            <span class="eval-label" id="eval-label">0.0</span>
          </div>
        </div>
        <div id="board"></div>
      </div>

      <aside class="panel">
        <section class="card engine-card">
          <div class="card-head">
            <span class="card-title">Engine Analysis</span>
            <span class="badge">Stockfish 19</span>
          </div>
          <p class="hint">Set the position, then analyse the side to move.</p>
          <div class="turn-row">
            <button id="btn-white" class="btn btn-white" type="button">White to Move</button>
            <button id="btn-black" class="btn btn-black" type="button">Black to Move</button>
          </div>
          <div class="engine-out">
            <div class="status" id="engine-status">Ready</div>
            <div class="best" id="best-move"></div>
            <div class="pv" id="pv"></div>
            <div class="meta" id="depth-info"></div>
          </div>
        </section>

        <section class="card">
          <div class="castling">
            <span class="label">Castling</span>
            <div class="castle-group">
              <button class="castle active" data-castle="K" type="button" title="White O-O">K</button>
              <button class="castle active" data-castle="Q" type="button" title="White O-O-O">Q</button>
              <button class="castle active" data-castle="k" type="button" title="Black O-O">k</button>
              <button class="castle active" data-castle="q" type="button" title="Black O-O-O">q</button>
            </div>
          </div>
          <div class="actions">
            <button id="btn-flip" class="btn btn-ghost" type="button">Flip</button>
            <button id="btn-reset" class="btn btn-ghost" type="button">Reset</button>
            <button id="btn-clear" class="btn btn-ghost" type="button">Clear</button>
          </div>
        </section>

        <section class="card fen-card">
          <label class="label" for="fen-input">FEN</label>
          <div class="fen-row">
            <input type="text" id="fen-input" readonly spellcheck="false" />
            <button id="btn-copy-fen" class="btn btn-ghost btn-sm" type="button">Copy</button>
          </div>
        </section>
      </aside>
    </div>

    <footer class="tray tray-bottom">
      <div class="piece-tray" id="tray-bottom"></div>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
