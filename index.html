<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockfish 19 Analysis</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://images.chesscomfiles.com" crossorigin />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="logo">♞</span>
        <div>
          <div class="title">Stockfish 19</div>
          <div class="sub">Board analysis</div>
        </div>
      </div>
      <div class="tray" id="tray-top"></div>
    </header>

    <div class="layout">
      <div class="board-side">
        <div class="eval-col">
          <div class="eval-bar" id="eval-bar">
            <div class="eval-fill" id="eval-fill"></div>
            <span class="eval-label" id="eval-label">0.0</span>
          </div>
        </div>
        <div class="board-frame">
          <div id="board"></div>
          <svg id="arrow-layer" class="arrow-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>

      <aside class="sidebar">
        <div class="block engine">
          <div class="block-head">
            <span>Analysis</span>
            <span class="pill">SF 19</span>
          </div>
          <div class="side-btns">
            <button id="btn-white" class="side-btn light" type="button">White to move</button>
            <button id="btn-black" class="side-btn dark" type="button">Black to move</button>
          </div>
          <div class="result">
            <div class="status" id="engine-status">Ready</div>
            <div class="best" id="best-move"></div>
            <div class="pv" id="pv"></div>
            <div class="meta" id="depth-info"></div>
          </div>
        </div>

        <div class="block">
          <div class="row-label">Castling</div>
          <div class="castles">
            <button class="castle on" data-castle="K" type="button">K</button>
            <button class="castle on" data-castle="Q" type="button">Q</button>
            <button class="castle on" data-castle="k" type="button">k</button>
            <button class="castle on" data-castle="q" type="button">q</button>
          </div>
          <div class="tools">
            <button id="btn-flip" class="tool" type="button">Flip</button>
            <button id="btn-reset" class="tool" type="button">Reset</button>
            <button id="btn-clear" class="tool" type="button">Clear</button>
          </div>
          <button id="btn-themes" class="tool tool-wide" type="button">Themes &amp; Settings</button>
        </div>

        <div class="block">
          <div class="row-label">FEN</div>
          <div class="fen-line">
            <input id="fen-input" type="text" readonly spellcheck="false" />
            <button id="btn-copy-fen" class="tool" type="button">Copy</button>
          </div>
        </div>

        <div class="block tray-block">
          <div class="row-label">White pieces</div>
          <div class="tray tray-inline" id="tray-bottom"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-labelledby="settings-title">
      <div class="modal-head">
        <div>
          <h2 id="settings-title">Board &amp; Pieces</h2>
          <p class="modal-sub">Customize the look of your board.</p>
        </div>
        <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      </div>

      <div class="modal-tabs">
        <button type="button" class="tab active" data-tab="boards">Boards</button>
        <button type="button" class="tab" data-tab="pieces">Pieces</button>
      </div>

      <div class="tab-panel active" id="tab-boards">
        <div class="swatch-grid" id="board-swatches"></div>
      </div>

      <div class="tab-panel" id="tab-pieces">
        <div class="piece-set-grid" id="piece-sets"></div>
      </div>

      <div class="modal-preview">
        <div class="mini-board" id="mini-board">
          <div class="mini-row"><div class="ms dark"></div><div class="ms light"></div><div class="ms dark"></div><div class="ms light"></div></div>
          <div class="mini-row"><div class="ms light"></div><div class="ms dark"></div><div class="ms light"></div><div class="ms dark"></div></div>
          <div class="mini-row"><div class="ms dark"></div><div class="ms light"></div><div class="ms dark"></div><div class="ms light"></div></div>
          <div class="mini-row"><div class="ms light"></div><div class="ms dark"></div><div class="ms light"></div><div class="ms dark"></div></div>
        </div>
        <div class="preview-pieces" id="preview-pieces"></div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
        <button type="button" class="btn-save" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="app.js"></script>
  <script src="vice-pieces.js"></script>
  <script src="themes.js"></script>
</body>
</html>
